name: CloudPulse Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # Install backend dependencies
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      # Run your 14 Vitest tests
      - name: Run backend tests
        working-directory: worker
        run: npm test -- --run

      # Deploy Cloudflare Worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"

      # Deploy Cloudflare Pages frontend
      - name: Deploy Frontend
        uses: cloudflare/wrangler-action@v4
        id: pages-deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=cloudpulse-dashboard
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        run: echo "Frontend deployed to ${{ steps.pages-deploy.outputs.deployment-url }}"